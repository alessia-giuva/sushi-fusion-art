<div class="contact-page bg-black text-white py-5">
    <div class="container py-5">
        <div class="mb-5">
            <h1 class="text-gold fw-bold border-start border-gold border-4 ps-3">Contattaci</h1>
            <p class="fs-5 mt-3">Siamo a tua completa disposizione per prenotazioni, eventi privati o semplici informazioni.</p>
        </div>

        <div class="row g-5">
            <!-- Colonna 1: Modulo di Contatto -->
            <div class="col-lg-7">
                <div class="p-4 rounded-4 bg-dark-card border border-gold-subtle shadow-sm">
                    <h3 class="text-gold mb-4">Inviaci un Messaggio</h3>
                    <form>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Nome e Cognome</label>
                                <input type="text" class="form-control custom-input" placeholder="Esempio: Mario Rossi">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control custom-input" placeholder="mario@esempio.com">
                            </div>
                            <div class="col-12">
                                <label class="form-label">Oggetto</label>
                                <input type="text" class="form-control custom-input" placeholder="Prenotazione, Catering, Feedback...">
                            </div>
                            <div class="col-12">
                                <label class="form-label">Messaggio</label>
                                <textarea class="form-control custom-input" rows="5" placeholder="Scrivi qui la tua richiesta..."></textarea>
                            </div>
                            <div class="col-12 mt-4">
                                <button type="submit" class="btn btn-gold btn-lg px-5 rounded-pill fw-bold">
                                    Invia Messaggio
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Colonna 2: Info Rapide e Mappa -->
            <div class="col-lg-5">
                <div class="h-100 d-flex flex-column gap-4">
                    <!-- Info Box -->
                    <div class="p-4 rounded-4 bg-dark-card border border-gold-subtle">
                        <h4 class="text-gold mb-3">Informazioni</h4>
                        <ul class="list-unstyled mb-0">
                            <li class="mb-3 d-flex align-items-center">
                                <i class="bi bi-geo-alt-fill text-gold me-3 fs-4"></i>
                                <span>Via Roma, 123 - 71121 Foggia (FG)</span>
                            </li>
                            <li class="mb-3 d-flex align-items-center">
                                <i class="bi bi-telephone-fill text-gold me-3 fs-4"></i>
                                <span>+39 389 1382567</span>
                            </li>
                            <li class="mb-0 d-flex align-items-center">
                                <i class="bi bi-envelope-fill text-gold me-3 fs-4"></i>
                                <span>info&#64;sushifoggia.it</span>
                            </li>
                        </ul>
                    </div>

                    <!-- Mappa (Placeholder elegante) -->
                    <div class="rounded-4 overflow-hidden border border-gold border-2 flex-grow-1 shadow-lg" style="min-height: 250px;">
                        <iframe 
                            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d11985.7481845686!2d15.5458025!3d41.4623789!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x1337456d9a746979%3A0xc6657c91795c792a!2s71121%20Foggia%20FG!5e0!3m2!1sit!2sit!4v1700000000000!5m2!1sit!2sit" 
                            width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy">
                        </iframe>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
